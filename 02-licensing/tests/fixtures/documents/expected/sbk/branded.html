<style id="sbk-css">/* ──────────────────────────────────────────────────────────────────
 * Small Business Kit — public stylesheet
 *
 * All sb-* blocks are styled here. Every color, radius and font is
 * driven by --sb-* CSS variables, which are set by the active theme.
 * Switching themes restyles every block on every page automatically.
 * ──────────────────────────────────────────────────────────────── */

/* ── Shared container geometry ──────────────────────────────
 * ONE source of truth for how wide the content column is and how
 * much side gutter it has. Every inner wrapper (header, hero,
 * body sections, CTA band, footer) uses these so the left/right
 * content edges line up perfectly all the way down the page,
 * regardless of which section you're looking at. See the
 * ".sbk-container" standardization rule in HARD OVERRIDES below. */
.cb-public { --sbk-container: 1320px; --sbk-gutter: clamp(20px, 4vw, 40px); }

/* Page container fix — let sb-* sections break out of the 820px cap. */
.cb-public main.cb-page:has(> section.sb), .cb-public main.cb-page:has(> section.sb-ctaband)
  { max-width: none !important; padding: 0 !important; }
@supports not (selector(:has(*))) { .cb-public main.cb-page { max-width: none; padding: 0; } }
.cb-public { overflow-x: hidden; }

/* Heading-color overrides — beat the .cb-public h1,h2,h3 ink rule
   which would otherwise paint our hero/CTA headings dark-on-dark. */
.cb-public .sb-hero h1,
.cb-public .sb-bg-dark h2,
.cb-public .sb-bg-dark h3,
.cb-public .sb-ctaband h2 { color: #fff !important; }
.cb-public .sb-hero h1 em,
.cb-public .sb-bg-dark h2 em,
.cb-public .sb-ctaband h2 em { color: var(--slate-color-accent, #00c6ff) !important; }
.cb-public .sb h2 { color: var(--slate-color-text, #0b1c2c); }
.cb-public .sb h2 em { color: var(--slate-color-accent, #00c6ff); }
.cb-public .sb-card h3 { color: var(--slate-color-text, #0b1c2c); }
.cb-public .sb-bg-dark .sb-card h3 { color: #fff !important; }

/* ── Base ───────────────────────────────────────────────── */
.sb, .sb * { box-sizing: border-box; }
.sb { font-family: var(--slate-font-sans); color: var(--slate-color-text); line-height: 1.6; }
.sb img { max-width: 100%; height: auto; display: block; }
.sb h1, .sb h2, .sb h3, .sb h4 { font-family: var(--slate-font-heading); letter-spacing: -.02em; }
.sb svg { flex: none; }

/* ── Container & section frame ──────────────────────────────
 * IMPORTANT: every container (.sbk-mainnav-inner header, hero
 * inner, body sb-inner, footer-inner) must share the same
 * max-width AND horizontal padding so vertical alignment is
 * consistent down the page. See the "HARD OVERRIDES" block at
 * the bottom of this file for the alignment guarantee. */
.sb { padding: clamp(64px, 9vw, 120px) 0; }
.sb-compact { padding: clamp(48px, 6vw, 80px) 0; }
.sb-inner {
  width: 100%; max-width: 1320px; margin: 0 auto;
  padding: 0 clamp(20px, 4vw, 40px);
}
.sb-bg-page    { background: var(--slate-color-canvas); }
.sb-bg-surface { background: var(--slate-color-surface); }
.sb-bg-tint    { background: var(--slate-color-surface-sunken); }
.sb-bg-dark    { background: var(--slate-color-text); color: #fff; }
.sb-bg-dark p, .sb-bg-dark .sb-section-sub { color: rgba(255,255,255,.74); }
.sb-bg-dark h2, .sb-bg-dark h3 { color: #fff; }

/* ── Section head (eyebrow + h2 + sub) ──────────────────── */
.sb-head { text-align: center; max-width: 720px; margin: 0 auto 52px; }
.sb-head.sb-head-left { text-align: left; margin: 0 0 44px; max-width: 640px; }
.sb-eyebrow {
  display: inline-block; font-size: 12px; letter-spacing: .14em;
  text-transform: uppercase; font-weight: var(--slate-font-weight-strong, 700); color: var(--slate-color-accent);
  margin-bottom: 14px;
}
.sb h2 { font-size: var(--sbk-h2-size, clamp(28px, 4vw, 44px)); line-height: 1.15; font-weight: var(--sbk-h2-weight, var(--slate-font-weight-display, 800)); letter-spacing: var(--slate-tracking-heading, -.025em); margin: 0 0 16px; text-wrap: balance; }
.sb h2 em { font-style: normal; color: var(--slate-color-accent); }
.sb-section-sub { font-size: var(--sbk-sub-size, 17px); color: var(--slate-color-text-muted); line-height: 1.65; margin: 0; }

/* ── Buttons ────────────────────────────────────────────── */
.sb-btn {
  display: inline-flex; align-items: center; gap: 9px;
  padding: var(--sbk-btn-pad, 14px 26px); border-radius: var(--slate-radius-control);
  font-weight: var(--slate-font-weight-button, 700); font-size: var(--sbk-btn-fs, 15px); cursor: pointer;
  text-decoration: none; border: 0;
  transition: transform .2s, box-shadow .2s, background .2s, color .2s;
}
.sb-btn svg { width: 16px; height: 16px; }
.sb-btn-primary { background: #00c6ff; background: var(--slate-color-accent, #00c6ff); color: #fff !important; box-shadow: 0 14px 30px -10px color-mix(in srgb, var(--slate-color-accent, #00c6ff) 65%, transparent); }
.sb-btn-primary:hover { background: #0099cc; background: var(--slate-color-accent-secondary, #0099cc); transform: translateY(-2px); }
.sb-btn-ghost { background: rgba(255,255,255,.10); color: #fff; border: 1px solid rgba(255,255,255,.28); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.sb-btn-ghost:hover { background: rgba(255,255,255,.20); transform: translateY(-2px); }
.sb-btn-dark { background: var(--slate-color-text); color: #fff; }
.sb-btn-dark:hover { background: var(--slate-color-text-secondary); transform: translateY(-2px); }
.sb-btn-outline { background: transparent; color: var(--slate-color-text); border: 1.5px solid var(--slate-color-border); }
.sb-btn-outline:hover { border-color: var(--slate-color-accent); color: var(--slate-color-accent); }

/* When the hero carries its own nav, hide CB's site header to avoid double-stacking. */
.cb-public:has(.sb-hero-with-nav) > header.cb-site-header { display: none !important; }
@supports not (selector(:has(*))) {
  /* Fallback: hide on every sb-themed page even without :has */
  body.cb-public > header.cb-site-header { display: none; }
}

/* ── HERO (sb-hero) ─────────────────────────────────────── */
.sb-hero {
  position: relative; min-height: 72vh;
  /* Top padding clears the global fixed header (utility ~46px + nav ~70px). */
  padding: clamp(170px, 20vh, 220px) 0 clamp(80px, 12vh, 140px);
  display: grid; place-items: center; color: #fff; overflow: hidden; isolation: isolate;
}
/* Center the inner container at the same 1320px gutter as the header.
   Text alignment inside the container is handled by .sb-hero-left below —
   we no longer use `place-items: center start` because grid justify-items
   overrides the inner's `margin: 0 auto` and sticks it to the section's
   left edge (which doesn't match the header's centered 1320px container). */
.sb-hero-tall { min-height: 100vh; min-height: 100dvh; }
.sb-hero-bg { position: absolute; inset: 0; z-index: -2; background-size: cover; background-position: center; }
.sb-hero::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background:
    linear-gradient(180deg, rgba(8,18,28,.86) 0%, rgba(8,18,28,.72) 45%, rgba(8,18,28,.96) 100%),
    radial-gradient(90% 60% at 50% 0%, color-mix(in srgb, var(--slate-color-accent, #00c6ff) 35%, transparent), transparent 70%);
}
/* Hero content sits inside the same 1320px gutter container the header uses. */
.sb-hero-inner {
  width: 100%; max-width: 1320px; margin: 0 auto;
  padding: 0 clamp(20px, 4vw, 40px);
  text-align: center;
  justify-self: center; /* belt-and-suspenders for grid contexts */
}
.sb-hero-left .sb-hero-inner { text-align: left; }
.sb-hero-left .sb-hero-inner > * { max-width: 880px; margin-left: 0; margin-right: auto; }
.sb-hero-left .sb-hero-inner > .sb-lede { max-width: 640px; }
.sb-hero .sb-eyebrow-pill {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: var(--slate-font-weight-strong, 700);
  color: var(--slate-color-accent, #00c6ff);
  background: color-mix(in srgb, var(--slate-color-accent, #00c6ff) 22%, rgba(0,0,0,.4));
  border: 1px solid color-mix(in srgb, var(--slate-color-accent, #00c6ff) 65%, transparent);
  padding: 7px 16px; border-radius: 999px; margin-bottom: 22px;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.sb-hero .sb-eyebrow-pill svg { width: 14px; height: 14px; }
.sb-hero h1 { font-family: var(--slate-font-heading) !important; font-size: var(--sbk-hero-h1-size, clamp(36px, 6.5vw, 72px)); line-height: 1.06; font-weight: var(--sbk-hero-h1-weight, var(--slate-font-weight-display, 800)); letter-spacing: var(--slate-tracking-heading, -.025em); margin: 0 0 22px; text-shadow: 0 2px 22px rgba(0,0,0,.32); color: #fff; max-width: 880px; text-wrap: balance; }
.sb-hero:not(.sb-hero-left) h1 { margin-left: auto; margin-right: auto; }
.sb-hero h1 em { font-style: normal; color: var(--slate-color-accent); }
.sb-hero p.sb-lede { font-size: var(--sbk-hero-lede-size, clamp(16px, 1.6vw, 19px)); color: rgba(255,255,255,.88); margin: 0 auto 32px; max-width: 62ch; line-height: 1.6; }
.sb-hero-left p.sb-lede { margin: 0 0 32px; }
.sb-hero-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.sb-hero-left .sb-hero-actions { justify-content: flex-start; }

/* Make absolutely sure every SBK heading uses the active theme's head font.
   Beats CB's public.css h1,h2,h3 rules and any inherited font cascades. */
.cb-public .sb h1, .cb-public .sb h2, .cb-public .sb h3,
.cb-public .sb-hero h1, .cb-public .sb-page-hero h1,
.cb-public .sb-card h3, .cb-public .sb-ctaband h2,
.cb-public .sbk-footer-brand-name {
  font-family: var(--slate-font-heading) !important;
}

/* Screen-reader-only utility (visually hidden, still readable to AT). */
.sbk-sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* ────────────────────────────────────────────────────────────────
 * GLOBAL STICKY HEADER (.sbk-header)
 *
 * Rendered by SBKHeader on every CB page. Transparent over the hero,
 * fades to solid dark when the user scrolls past 30px. The mobile
 * menu opens as a full-viewport glass overlay.
 * ──────────────────────────────────────────────────────────────── */
.sbk-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 60;
  color: #fff; font-family: var(--slate-font-sans, -apple-system, "Inter", sans-serif);
  transition: background .25s ease, backdrop-filter .25s ease, box-shadow .25s ease;
  background: transparent;
}
.sbk-header.sbk-scrolled {
  background: color-mix(in srgb, var(--slate-color-text, #0b1c2c) 92%, transparent);
  -webkit-backdrop-filter: blur(14px) saturate(160%); backdrop-filter: blur(14px) saturate(160%);
  box-shadow: 0 10px 30px -12px rgba(0,0,0,.45);
}

/* Top utility bar */
.sbk-utility {
  border-bottom: 1px solid rgba(255,255,255,.10);
  background: rgba(0,0,0,.18);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  font-size: 13px; transition: background .25s, opacity .25s, max-height .25s;
}
.sbk-header.sbk-scrolled .sbk-utility { background: rgba(0,0,0,.10); }
.sbk-utility-inner {
  max-width: 1320px; margin: 0 auto; padding: 10px clamp(20px, 4vw, 40px);
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
}
.sbk-utility-contact { display: flex; gap: 22px; flex-wrap: wrap; align-items: center; }
.sbk-utility-contact a {
  display: inline-flex; align-items: center; gap: 9px;
  color: rgba(255,255,255,.90); text-decoration: none; font-weight: 500;
  transition: color .15s;
}
.sbk-utility-contact a:hover { color: var(--slate-color-accent, #00c6ff); }
.sbk-utility-ico {
  width: 26px; height: 26px; border-radius: 50%;
  display: inline-grid; place-items: center;
  background: color-mix(in srgb, var(--slate-color-accent, #00c6ff) 22%, transparent);
  color: var(--slate-color-accent, #00c6ff);
}
.sbk-utility-social { margin-left: auto; display: flex; gap: 12px; align-items: center; }
.sbk-utility-social a {
  width: 30px; height: 30px; display: inline-grid; place-items: center;
  color: rgba(255,255,255,.78); border-radius: 50%;
  transition: color .15s, background .15s;
}
.sbk-utility-social a:hover { color: var(--slate-color-accent, #00c6ff); background: rgba(255,255,255,.08); }

/* Main nav row */
.sbk-mainnav { padding: 4px 0; }
.sbk-mainnav-inner {
  max-width: 1320px; margin: 0 auto; padding: 14px clamp(20px, 4vw, 40px);
  display: flex; align-items: center; gap: 28px;
}
.sbk-brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; }
.sbk-brand img { height: 44px; width: auto; transition: height .2s; filter: drop-shadow(0 4px 16px rgba(0,0,0,.35)); }
.sbk-header.sbk-scrolled .sbk-brand img { height: 38px; }
.sbk-brand-name { font-weight: var(--slate-font-weight-display, 800); font-size: 19px; letter-spacing: -.01em; font-family: var(--slate-font-heading); }

.sbk-menu { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.sbk-menu-inner { display: flex; align-items: center; gap: 4px; }
.sbk-menu a {
  color: rgba(255,255,255,.92);
  font-weight: var(--slate-font-weight-nav, 700); font-size: 14px;
  letter-spacing: var(--slate-tracking-nav, .08em);
  text-transform: var(--sbk-nav-transform, uppercase);
  padding: 10px 18px; border-radius: 6px; text-decoration: none;
  transition: color .15s, background .15s;
}
.sbk-menu a:hover { color: var(--slate-color-accent, #00c6ff); }
.sbk-menu a.sbk-nav-cta {
  background: var(--slate-color-accent, #00c6ff); color: #fff !important;
  padding: 12px 22px; border-radius: var(--slate-radius-control, 999px);
  margin-left: 12px;
  box-shadow: 0 10px 26px -10px color-mix(in srgb, var(--slate-color-accent, #00c6ff) 65%, transparent);
}
.sbk-menu a.sbk-nav-cta:hover { background: var(--slate-color-accent-secondary, #0099cc); transform: translateY(-1px); }

/* Burger + close (only shown on mobile / overlay) */
.sbk-burger {
  display: none; margin-left: auto;
  width: 44px; height: 44px; padding: 0;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16);
  border-radius: 8px; cursor: pointer;
  flex-direction: column; align-items: center; justify-content: center; gap: 4px;
}
.sbk-burger span { display: block; width: 20px; height: 2px; background: #fff; border-radius: 2px; }
.sbk-close {
  display: none; align-self: flex-end;
  background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.18);
  width: 44px; height: 44px; border-radius: 8px; color: #fff; cursor: pointer;
  display: none; align-items: center; justify-content: center;
}

/* Mobile: overlay menu */
@media (max-width: 980px) {
  .sbk-utility-inner { gap: 14px; font-size: 12.5px; }
  .sbk-burger { display: inline-flex; }
  .sbk-menu {
    position: fixed; top: 0; right: 0;
    width: min(420px, 90vw); height: 100vh; height: 100dvh; margin: 0;
    background: color-mix(in srgb, var(--slate-color-text, #0b1c2c) 75%, transparent);
    -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%);
    border-left: 1px solid rgba(255,255,255,.12);
    box-shadow: -30px 0 80px -20px rgba(0,0,0,.55);
    padding: 24px 26px 40px;
    flex-direction: column; align-items: stretch;
    transform: translateX(100%); transition: transform .35s cubic-bezier(.4,0,.2,1);
    overflow-y: auto;
  }
  .sbk-open .sbk-menu { transform: translateX(0); }
  .sbk-close { display: inline-flex; margin-bottom: 22px; }
  .sbk-menu-inner { flex-direction: column; align-items: stretch; gap: 4px; }
  .sbk-menu a {
    padding: 14px 16px; font-size: 15px; border-bottom: 1px solid rgba(255,255,255,.08); border-radius: 0;
  }
  .sbk-menu a:hover { background: rgba(255,255,255,.06); color: var(--slate-color-accent, #00c6ff); }
  .sbk-menu a.sbk-nav-cta {
    margin: 18px 0 0; text-align: center; border-bottom: 0; padding: 14px 22px;
  }
  /* Backdrop behind the side panel */
  .sbk-open::after {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background: rgba(0,0,0,.45); pointer-events: none;
  }
}
@media (max-width: 560px) {
  .sbk-utility { display: none; }
}

/* Push the regular page below the fixed header so heroes still fit. */
.cb-public main.cb-page { padding-top: 0; }
.cb-public > main.cb-page { scroll-margin-top: 110px; }
/* Hide CB's old built-in site header AND footer on every page — we
   render our own modern sticky header and multi-column footer. */
.cb-public > header.cb-site-header,
.cb-public > footer.cb-site-footer { display: none !important; }

/* ──────────────────────────────────────────────────────────────
 * GLOBAL FOOTER (.sbk-footer)
 * ───────────────────────────────────────────────────────────── */
.sbk-footer {
  background: var(--slate-color-text, #0b1c2c);
  color: rgba(255,255,255,.86);
  font-family: var(--slate-font-sans, -apple-system, "Inter", sans-serif);
  position: relative;
}
.sbk-footer::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .8;
  background:
    radial-gradient(60% 80% at 10% 0%, color-mix(in srgb, var(--slate-color-accent, #00c6ff) 12%, transparent), transparent 60%),
    radial-gradient(40% 60% at 100% 100%, color-mix(in srgb, var(--slate-color-accent, #00c6ff) 8%, transparent), transparent 60%);
}
.sbk-footer-inner {
  position: relative;
  width: 100%; max-width: 1320px; margin: 0 auto;
  padding: clamp(64px, 8vw, 96px) clamp(20px, 4vw, 40px) clamp(40px, 5vw, 56px);
  display: grid; gap: clamp(28px, 4vw, 52px);
  grid-template-columns: 1.5fr 1fr 1fr 1.3fr;
}
@media (max-width: 980px) { .sbk-footer-inner { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .sbk-footer-inner { grid-template-columns: 1fr; gap: 32px; } }

.sbk-footer .sbk-footer-h {
  color: #fff; font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
  font-weight: var(--slate-font-weight-strong, 700); margin: 0 0 18px; font-family: var(--slate-font-sans);
}
.sbk-footer ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
.sbk-footer ul a, .sbk-footer ul li > span {
  color: rgba(255,255,255,.84); text-decoration: none; font-size: 14.5px;
  transition: color .15s;
}
.sbk-footer ul a:hover { color: var(--slate-color-accent, #00c6ff); }

.sbk-footer-brand { display: flex; flex-direction: column; gap: 18px; }
.sbk-footer-logo img { height: 46px; width: auto; filter: drop-shadow(0 4px 16px rgba(0,0,0,.4)); }
.sbk-footer-brand-name { font-weight: var(--slate-font-weight-display, 800); font-size: 22px; color: #fff; letter-spacing: -.01em; font-family: var(--slate-font-heading); }
.sbk-footer-about { margin: 0; color: rgba(255,255,255,.78); font-size: 14.5px; line-height: 1.65; max-width: 36ch; }
.sbk-footer-social { display: flex; gap: 12px; margin-top: 4px; }
.sbk-footer-social a {
  width: 36px; height: 36px; display: inline-grid; place-items: center;
  border-radius: 50%; color: rgba(255,255,255,.78);
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.10);
  transition: color .15s, background .15s, transform .15s;
}
.sbk-footer-social a:hover {
  color: #fff; background: var(--slate-color-accent, #00c6ff); transform: translateY(-2px);
  box-shadow: 0 10px 24px -10px color-mix(in srgb, var(--slate-color-accent, #00c6ff) 60%, transparent);
}

.sbk-footer-contact ul li {
  display: flex; align-items: flex-start; gap: 10px; line-height: 1.55;
}
.sbk-footer-ico {
  width: 26px; height: 26px; border-radius: 50%; flex: none;
  display: inline-grid; place-items: center; margin-top: 2px;
  background: color-mix(in srgb, var(--slate-color-accent, #00c6ff) 18%, transparent);
  color: var(--slate-color-accent, #00c6ff);
}

.sbk-footer-bottom {
  position: relative;
  border-top: 1px solid rgba(255,255,255,.08);
  background: rgba(0,0,0,.18);
}
.sbk-footer-bottom-inner {
  width: 100%; max-width: 1320px; margin: 0 auto;
  padding: 18px clamp(20px, 4vw, 40px);
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  font-size: 13px; color: rgba(255,255,255,.78);
}
.sbk-footer-bottom-inner a { color: rgba(255,255,255,.74); text-decoration: none; transition: color .15s; }
.sbk-footer-bottom-inner a:hover { color: var(--slate-color-accent, #00c6ff); }
@media (max-width: 560px) {
  .sbk-footer-bottom-inner { flex-direction: column; align-items: flex-start; }
}

/* ──────────────────────────────────────────────────────────────
 * SUB-PAGE HERO (sb-page-hero)
 *
 * Compact hero with breadcrumb + heading + lede. Used for all
 * pages other than the homepage so the fixed header still has
 * something dark to sit on.
 * ───────────────────────────────────────────────────────────── */
.sb-page-hero {
  position: relative; min-height: 56vh;
  /* Section is full-bleed (no horizontal padding); inner mirrors the
     header container so the heading aligns to the logo's left edge. */
  padding: clamp(180px, 22vh, 240px) 0 clamp(56px, 8vw, 90px);
  display: grid; align-items: end; color: #fff; overflow: hidden; isolation: isolate;
  font-family: var(--slate-font-sans);
}
.sb-page-hero-bg { position: absolute; inset: 0; z-index: -2; background-size: cover; background-position: center; }
.sb-page-hero::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background:
    linear-gradient(180deg, rgba(8,18,28,.78) 0%, rgba(8,18,28,.70) 50%, rgba(8,18,28,.92) 100%),
    radial-gradient(80% 60% at 0% 100%, color-mix(in srgb, var(--slate-color-accent, #00c6ff) 25%, transparent), transparent 60%);
}
.sb-page-hero-inner {
  width: 100%; max-width: 1320px; margin: 0 auto;
  padding: 0 clamp(20px, 4vw, 40px);
}
.sb-crumbs {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 18px; font-size: 14px; font-weight: var(--slate-font-weight-strong, 600); letter-spacing: .04em;
}
.sb-crumbs a { color: rgba(255,255,255,.78); text-decoration: none; transition: color .15s; }
.sb-crumbs a:hover { color: var(--slate-color-accent, #00c6ff); }
.sb-crumb-sep { color: var(--slate-color-accent, #00c6ff); }
.sb-crumb-current { color: #fff; }
.sb-page-hero h1 {
  font-family: var(--slate-font-heading) !important;
  font-size: var(--sbk-h1-size, clamp(36px, 5.8vw, 64px)); line-height: 1.05;
  font-weight: var(--sbk-h1-weight, var(--slate-font-weight-display, 800));
  letter-spacing: var(--slate-tracking-heading, -.025em);
  margin: 0 0 18px; color: #fff !important; text-shadow: 0 2px 22px rgba(0,0,0,.32);
  max-width: 880px; text-wrap: balance;
}
.sb-page-hero-lede {
  font-family: var(--slate-font-sans);
  font-size: clamp(15px, 1.4vw, 18px); color: rgba(255,255,255,.86);
  margin: 0 0 22px; max-width: 60ch; line-height: 1.6;
}
.sb-page-hero-cta { margin-top: 6px; }

/* ── HERO FEATURE STRIP — minimal "tagline" treatment ──
 * Thin top divider, no chip backgrounds, no big icons.
 * Just spaced phrases separated by hairline dividers, with a
 * subtle accent index number prefix.
 */
.sb-hero-features {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
  border-top: 1px solid rgba(255,255,255,.10);
  background: rgba(0,0,0,.18);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.sb-hero-features-inner {
  max-width: 1320px; margin: 0 auto;
  padding: 14px clamp(20px, 4vw, 40px);
  display: flex; flex-wrap: wrap; align-items: center;
  gap: 0;
}
.sb-hero-feature {
  display: inline-flex; align-items: center; gap: 14px;
  color: rgba(255,255,255,.86);
  font-family: var(--slate-font-sans);
  font-size: 14.5px; font-weight: 500; letter-spacing: .01em;
  padding: 8px clamp(20px, 3.2vw, 40px);
  position: relative;
}
/* Hairline dividers between features (desktop only). */
.sb-hero-feature + .sb-hero-feature::before {
  content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 1px; height: 18px; background: rgba(255,255,255,.18);
}
.sb-hero-feature:first-child { padding-left: 0; }
.sb-hero-feature:last-child  { padding-right: 0; }

/* Hide the SVG chevron emitted by the block — replace with a small accent dot. */
.sb-hero-feature-dot {
  width: 6px; height: 6px; border-radius: 50%; flex: none;
  background: var(--slate-color-accent, #00c6ff);
  display: inline-block;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--slate-color-accent, #00c6ff) 18%, transparent);
}
.sb-hero-feature-dot svg { display: none; }

@media (max-width: 760px) {
  .sb-hero-features-inner { padding: 10px clamp(16px, 4vw, 24px); gap: 4px; }
  .sb-hero-feature { padding: 6px 14px 6px 0; }
  .sb-hero-feature + .sb-hero-feature::before { display: none; }
}

/* ── FEATURE GRID (sb-feature-grid) ─────────────────────── */
.sb-grid { display: grid; gap: clamp(18px, 2.4vw, 26px); }
.sb-grid-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.sb-grid-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.sb-grid-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
@media (max-width: 960px) { .sb-grid-3, .sb-grid-4 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 620px) { .sb-grid-2, .sb-grid-3, .sb-grid-4 { grid-template-columns: minmax(0,1fr); } }

.sb-card {
  background: var(--slate-color-canvas); border: 1px solid var(--slate-color-border); border-radius: var(--slate-radius-lg);
  padding: clamp(24px, 2.6vw, 34px);
  transition: transform .25s, box-shadow .25s, border-color .25s;
  box-shadow: 0 2px 10px -2px color-mix(in srgb, var(--slate-color-text) 6%, transparent);
}
.sb-card:hover { transform: translateY(-6px); box-shadow: 0 18px 50px -20px color-mix(in srgb, var(--slate-color-text) 22%, transparent); border-color: color-mix(in srgb, var(--slate-color-accent) 35%, var(--slate-color-border)); }
.sb-card-icon {
  width: 54px; height: 54px; border-radius: 14px;
  background: color-mix(in srgb, var(--slate-color-accent) 12%, transparent);
  color: var(--slate-color-accent); display: grid; place-items: center; margin-bottom: 18px;
}
.sb-card-icon svg { width: 26px; height: 26px; }
.sb-card h3 { font-size: 20px; line-height: 1.3; font-weight: var(--slate-font-weight-heading, 750); margin: 0 0 10px; color: var(--slate-color-text); font-family: var(--slate-font-heading); }
.sb-card p { margin: 0 0 16px; color: var(--slate-color-text-muted); font-size: 15px; line-height: 1.6; }
.sb-card-num { font-size: 13px; font-weight: var(--slate-font-weight-strong, 800); color: var(--slate-color-accent); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 12px; }
.sb-card-link { display: inline-flex; align-items: center; gap: 6px; font-weight: var(--slate-font-weight-strong, 700); font-size: 14.5px; color: var(--slate-color-accent); text-decoration: none; }
.sb-card-link svg { width: 14px; height: 14px; transition: transform .2s; }
.sb-card-link:hover svg { transform: translateX(3px); }

/* Dark variant */
.sb-bg-dark .sb-card { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.sb-bg-dark .sb-card:hover { background: rgba(255,255,255,.10); border-color: color-mix(in srgb, var(--slate-color-accent) 60%, transparent); }
.sb-bg-dark .sb-card h3 { color: #fff; }
.sb-bg-dark .sb-card p { color: rgba(255,255,255,.74); }

/* ── SPLIT (sb-split: image + text) ─────────────────────── */
.sb-split { display: grid; gap: clamp(28px, 5vw, 72px); align-items: center; grid-template-columns: 1.1fr 1fr; }
.sb-split.sb-split-r { grid-template-columns: 1fr 1.1fr; }
.sb-split.sb-split-r .sb-split-media { order: 2; }
@media (max-width: 880px) { .sb-split, .sb-split.sb-split-r { grid-template-columns: 1fr; } .sb-split.sb-split-r .sb-split-media { order: 0; } }
.sb-split-media { position: relative; }
.sb-split-media img { width: 100%; min-height: 360px; max-height: 560px; object-fit: cover; border-radius: var(--slate-radius-lg); box-shadow: 0 18px 50px -20px rgba(11,28,44,.20); }
.sb-split-body h2 { font-size: clamp(28px, 3.6vw, 40px); margin: 14px 0 16px; }
.sb-split-body p { font-size: 16.5px; color: var(--slate-color-text-muted); line-height: 1.7; margin: 0 0 18px; }

/* ── QUOTE GRID (sb-quote-grid) ─────────────────────────── */
.sb-quote {
  background: var(--slate-color-canvas); border: 1px solid var(--slate-color-border); border-radius: var(--slate-radius-lg);
  padding: clamp(28px, 3vw, 40px);
  position: relative; transition: transform .25s, box-shadow .25s;
  box-shadow: 0 2px 10px -2px color-mix(in srgb, var(--slate-color-text) 6%, transparent);
}
.sb-quote:hover { transform: translateY(-4px); box-shadow: 0 18px 50px -20px color-mix(in srgb, var(--slate-color-text) 22%, transparent); }
.sb-quote::before {
  content: "\201C"; position: absolute; top: 14px; left: 22px;
  font-size: 90px; line-height: 1; font-family: Georgia, serif;
  color: var(--slate-color-accent); opacity: .22;
}
.sb-quote-stars { color: var(--slate-color-accent); letter-spacing: 3px; font-size: 16px; margin-bottom: 12px; position: relative; }
.sb-quote p { position: relative; font-size: 16.5px; line-height: 1.65; color: var(--slate-color-text-secondary); margin: 0 0 22px; font-weight: 500; }
.sb-quote-author { display: flex; align-items: center; gap: 14px; }
.sb-quote-avatar {
  width: 46px; height: 46px; border-radius: 50%;
  background: linear-gradient(135deg, var(--slate-color-accent), var(--slate-color-accent-secondary));
  color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 16px;
}
.sb-quote-name { font-weight: var(--slate-font-weight-strong, 700); font-size: 15px; color: var(--slate-color-text); }
.sb-quote-meta { font-size: 13px; color: var(--slate-color-text-muted); margin-top: 1px; }

/* Stats strip above quotes */
.sb-stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 18px; max-width: 900px; margin: 0 auto 56px; }
@media (max-width: 720px) { .sb-stats { grid-template-columns: repeat(2, 1fr); } }
.sb-stat { text-align: center; padding: 22px 18px; background: var(--slate-color-canvas); border: 1px solid var(--slate-color-border); border-radius: var(--slate-radius-md); box-shadow: 0 2px 10px -2px color-mix(in srgb, var(--slate-color-text) 6%, transparent); }
.sb-stat strong { display: block; font-size: clamp(22px, 3.2vw, 34px); font-weight: var(--slate-font-weight-display, 800); color: var(--slate-color-accent); letter-spacing: -.02em; line-height: 1.1; white-space: nowrap; font-family: var(--slate-font-heading); }
.sb-stat strong.sb-stat-text { font-size: clamp(16px, 2.2vw, 22px); letter-spacing: .02em; }
.sb-stat span { display: block; font-size: 12px; color: var(--slate-color-text-muted); font-weight: var(--slate-font-weight-strong, 600); letter-spacing: .04em; text-transform: uppercase; margin-top: 6px; }

/* ── CTA BAND (sb-cta-band) ─────────────────────────────── */
.sb-ctaband {
  /* Horizontal gutter comes from .sb-ctaband-inner (shared container
     rule) — NOT the section — so the CTA aligns with every other block. */
  position: relative; padding: clamp(56px, 8vw, 96px) 0;
  background: linear-gradient(135deg, var(--slate-color-text) 0%, var(--slate-color-text-secondary) 60%, color-mix(in srgb, var(--slate-color-text) 80%, var(--slate-color-accent)) 100%);
  color: #fff; overflow: hidden;
}
.sb-ctaband::before {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(60% 80% at 20% 0%, color-mix(in srgb, var(--slate-color-accent) 30%, transparent), transparent 60%),
              radial-gradient(50% 70% at 100% 100%, color-mix(in srgb, var(--slate-color-accent) 22%, transparent), transparent 60%);
}
/* Flex column + align-items:center guarantees the heading, sub-text and
   button all sit dead-centre on every device — regardless of the per-element
   `margin: 0 0 X` rules below (which otherwise pin the block to the left). */
.sb-ctaband-inner { position: relative; width: 100%; max-width: 1320px; margin: 0 auto; text-align: center; display: flex; flex-direction: column; align-items: center; }
.sb-ctaband-inner > * { max-width: 900px; margin-left: auto; margin-right: auto; }

/* ════════════════════════════════════════════════════════════════════
 * CONTAINER STANDARDIZATION — the single alignment guarantee.

 * Every inner wrapper on the page gets the SAME box model so its content
 * column is exactly --sbk-container (1320px) wide, centered, with an

  margin-left: auto !important;
  margin-right: auto !important;

  padding-right: var(--sbk-gutter, clamp(20px, 4vw, 40px)) !important;
}

/* SBK build marker — bump this when you change anything visible so you can

.cb-footer-link:hover { color: var(--slate-color-accent-strong); opacity: 1; }
.cb-footer-copy { color: var(--slate-color-text-muted); font-size: .85rem; margin: 0; }
.cb-footer-minimal .cb-footer-nav { display: none; }

/* ---- Header: end group (nav + CTA button) ---- */
.cb-header-end { display: flex; align-items: center; gap: 1.6rem; flex-wrap: wrap; }
.cb-header-cta { padding: .55rem 1.2rem; font-size: .95rem; }
.cb-header-centered .cb-header-end { justify-content: center; }

/* ---- Header preset: bordered ---- */
.cb-header-bordered { border-bottom: 2px solid var(--slate-color-text); }
.cb-header-bordered .cb-site-header-inner { padding-top: 1.4rem; padding-bottom: 1.4rem; }
.cb-header-bordered .cb-nav-link { text-transform: uppercase; letter-spacing: .06em; font-size: .82rem; font-weight: 600; }

/* ---- Header preset: accent bar (filled with brand colour) ---- */
.cb-header-accent { background: var(--slate-color-accent); border-bottom: 0; }
.cb-header-accent .cb-brand-name,
.cb-header-accent .cb-brand-tagline,
.cb-header-accent .cb-nav-link { color: var(--slate-color-on-accent, #fff); }
.cb-header-accent .cb-nav-link { opacity: .9; }
.cb-header-accent .cb-nav-link:hover { opacity: 1; color: var(--slate-color-on-accent, #fff); }
.cb-header-accent .cb-header-cta { background: #fff; color: var(--slate-color-accent-strong); }
.cb-header-accent .cb-header-cta:hover { background: rgba(255,255,255,.88); }

/* ---- Footer preset: columns (brand left, links right) ---- */
.cb-footer-columns .cb-site-footer-inner { display: flex; justify-content: space-between; align-items: flex-start;
                                           gap: 2rem; text-align: left; flex-wrap: wrap; }
.cb-footer-columns .cb-footer-brandcol { display: flex; flex-direction: column; gap: .3rem; }
.cb-footer-brandname { font-family: var(--slate-font-heading); font-size: 1.2rem; font-weight: 700; color: var(--slate-color-text); }
.cb-footer-tagline { color: var(--slate-color-text-muted); font-size: .88rem; max-width: 30ch; }
.cb-footer-columns .cb-footer-linkcol { display: flex; flex-direction: column; align-items: flex-end; gap: .8rem; }
.cb-footer-columns .cb-footer-nav { margin-bottom: 0; justify-content: flex-end; }
@media (max-width: 640px) {
  .cb-footer-columns .cb-site-footer-inner { flex-direction: column; }
  .cb-footer-columns .cb-footer-linkcol { align-items: flex-start; }
  .cb-footer-columns .cb-footer-nav { justify-content: flex-start; }
}

.cb-preview-banner { background: #fef3c7; color: #92400e; padding: .5rem 1rem; text-align: center; font: 14px system-ui, sans-serif; }

/* ---- HERO: split (default) + image overlay variants ---- */
.cb-hero { padding: 4.5rem 1.25rem; background: var(--slate-color-canvas); }
.cb-hero-inner { max-width: 1100px; margin: 0 auto; }

/* Split hero: image + text side by side */
.cb-hero-split .cb-hero-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: center; }
.cb-hero-split .cb-hero-media img { width: 100%; height: 100%; max-height: 460px; object-fit: cover; border-radius: var(--slate-radius-md); display: block; }
.cb-hero-split.cb-hero-media-right .cb-hero-media { order: 2; }
.cb-hero-title { font-size: 2.8rem; letter-spacing: -.01em; margin: 0 0 .6rem; }
.cb-hero-sub { font-size: 1.15rem; color: var(--slate-color-text-muted); margin: 0 0 1.6rem; }
.cb-hero-actions { display: flex; gap: .75rem; flex-wrap: wrap; }
@media (max-width: 800px){ .cb-hero-split .cb-hero-inner { grid-template-columns: 1fr; } .cb-hero-split.cb-hero-media-right .cb-hero-media { order: 0; } .cb-hero-title { font-size: 2.1rem; } }

/* Banner hero: text over background image */
.cb-hero-banner { background-size: cover; background-position: center; color: #fff; position: relative; }
.cb-hero-banner::before { content: ""; position: absolute; inset: 0; }
.cb-hero-banner.cb-overlay-light::before  { background: rgba(0,0,0,.28); }
.cb-hero-banner.cb-overlay-medium::before { background: rgba(0,0,0,.48); }
.cb-hero-banner.cb-overlay-dark::before   { background: rgba(0,0,0,.66); }
.cb-hero-banner .cb-hero-inner { position: relative; text-align: center; max-width: 760px; }
.cb-hero-banner .cb-hero-title, .cb-hero-banner .cb-hero-sub { color: #fff; }
.cb-hero-banner .cb-hero-actions { justify-content: center; }
.cb-hero-h-short  { padding: 3rem 1.25rem; }
.cb-hero-h-tall   { padding: 8rem 1.25rem; }

/* Banner hero with NO background image: readable dark text on a soft surface,
   instead of white-on-white. */
.cb-hero-banner.cb-hero-plain { color: var(--slate-color-text); background: var(--slate-color-surface); }
.cb-hero-banner.cb-hero-plain::before { display: none; }
.cb-hero-banner.cb-hero-plain .cb-hero-title { color: var(--slate-color-text); }
.cb-hero-banner.cb-hero-plain .cb-hero-sub   { color: var(--slate-color-text-muted); }

/* ---- Section backgrounds ---- */
.cb-bg-page { background: var(--slate-color-canvas); }
.cb-bg-white { background: #fff; }
.cb-bg-tint  { background: var(--slate-color-surface); }
.cb-bg-tint2 { background: var(--slate-color-surface-sunken); }
.cb-bg-dark  { background: #0f172a; }
.cb-bg-dark .cb-section-title, .cb-bg-dark .cb-card-title { color: #f8fafc; }
.cb-bg-dark .cb-card { background: #1e293b; }
.cb-bg-dark .cb-card-text { color: #cbd5e1; }

/* ---- Grids ---- */
.cb-grid { display: grid; gap: 1.6rem; }
.cb-grid-2 { grid-template-columns: repeat(2,1fr); }
.cb-grid-3 { grid-template-columns: repeat(3,1fr); }
.cb-grid-4 { grid-template-columns: repeat(4,1fr); }
@media (max-width:820px){ .cb-grid-2,.cb-grid-3,.cb-grid-4 { grid-template-columns: 1fr; } }
@media (min-width:821px) and (max-width:1024px){ .cb-grid-4 { grid-template-columns: repeat(2,1fr); } }

/* ---- Cards (icon + image), SS2-style ---- */
.cb-card { background: var(--slate-color-surface); border-radius: var(--slate-radius-md); padding: 2rem 1.6rem;
           transition: transform .15s ease, box-shadow .15s ease; }
.cb-card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,.07); }
.cb-card-icon { display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 52px;
                border-radius: 50%; background: var(--slate-color-canvas); color: var(--slate-color-accent-strong); margin-bottom: 1.1rem; }
.cb-card-title { font-size: 1.2rem; margin: 0 0 .5rem; color: var(--slate-color-accent-strong); font-family: var(--slate-font-heading); }
.cb-card-text { color: var(--slate-color-text-muted); margin: 0 0 1rem; }
.cb-card-link { font-weight: 600; text-decoration: none; color: var(--slate-color-accent-strong); text-transform: uppercase;
                letter-spacing: .06em; font-size: .8rem; }
.cb-card-link:hover { color: var(--slate-color-accent-strong); }
.cb-icon-grid .cb-card { text-align: center; }
.cb-icon-grid .cb-card-icon { margin-left: auto; margin-right: auto; }

/* Image cards */
.cb-image-card { display: block; text-decoration: none; color: inherit; background: var(--slate-color-surface);
                 border-radius: var(--slate-radius-md); overflow: hidden; transition: transform .15s ease, box-shadow .15s ease; }
.cb-image-card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,.08); }
.cb-image-card-img { width: 100%; height: 210px; object-fit: cover; display: block; }
.cb-image-card-ph { width: 100%; height: 210px; display: flex; align-items: center; justify-content: center;
                    background: linear-gradient(135deg, var(--slate-color-surface), var(--slate-color-surface-sunken));
                    color: var(--slate-color-text-muted); opacity: .55; }
.cb-image-card-body { padding: 1.3rem 1.4rem; }
.cb-image-card-title { font-size: 1.2rem; margin: 0 0 .35rem; color: var(--slate-color-text); font-family: var(--slate-font-heading); }
.cb-image-card-text { color: var(--slate-color-text-muted); margin: 0; }

/* ---- CTA ---- */
.cb-cta { padding: 4.5rem 1.25rem; background: var(--slate-color-accent); }
.cb-cta-inner { max-width: 700px; margin: 0 auto; text-align: center; color: var(--slate-color-on-accent, #fff); }
.cb-cta-title { font-size: 2.1rem; margin: 0 0 .5rem; color: var(--slate-color-on-accent, #fff); }
.cb-cta-text { margin: 0 0 1.6rem; opacity: .92; }
.cb-cta .cb-btn-primary { background: #fff; color: var(--slate-color-accent-strong); }
.cb-cta .cb-btn-primary:hover { background: rgba(255,255,255,.9); }

/* ---- Testimonial ---- */
.cb-testimonial { padding: 4.5rem 1.25rem; background: var(--slate-color-surface-sunken); }
.cb-testimonial-inner { max-width: 760px; margin: 0 auto; text-align: center; }
.cb-testimonial-quote { font-size: 1.5rem; line-height: 1.5; font-style: italic; margin: 0 0 1.4rem; color: var(--slate-color-text);
                        font-family: var(--slate-font-heading); }
.cb-testimonial-cite { display: flex; align-items: center; justify-content: center; gap: .75rem; }
.cb-testimonial-avatar { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; }
.cb-testimonial-author { font-weight: 700; }
.cb-testimonial-role { display: block; color: var(--slate-color-text-muted); font-size: .9rem; }

/* ============================================================
   v1.5.0 — page width, type scale, button shape, section pad
   ============================================================ */

/* Global type scale (set via --slate-type-scale on :root) */
.cb-public { font-size: calc(1rem * var(--slate-type-scale, 1)); }

/* Button shape (square / rounded / pill via --slate-radius-control) */
.cb-public .cb-btn { border-radius: var(--slate-radius-control, var(--slate-radius-md, 10px)); }

/* ---- Page width presets ---- */
/* boxed: standard max-width containers (default, already set per-section).
   full:  sections span full width, inner content still constrained.
   canvas: everything edge-to-edge, no max-width — for full-bleed designs. */
.cb-w-boxed  .cb-section-inner,
.cb-w-boxed  .cb-hero-inner,
.cb-w-boxed  .cb-cta-inner,
.cb-w-boxed  .cb-testimonial-inner { /* defaults already apply */ }

.cb-w-full .cb-section-inner,
.cb-w-full .cb-hero-inner { max-width: 1320px; }

.cb-w-canvas .cb-section,
.cb-w-canvas .cb-hero,
.cb-w-canvas .cb-cta,
.cb-w-canvas .cb-testimonial { padding-left: 0; padding-right: 0; }
.cb-w-canvas .cb-section-inner,
.cb-w-canvas .cb-hero-inner,
.cb-w-canvas .cb-cta-inner,
.cb-w-canvas .cb-testimonial-inner { max-width: none; padding-left: 2rem; padding-right: 2rem; }
.cb-w-canvas .cb-hero-split .cb-hero-media img { border-radius: 0; }

/* ---- Per-section spacing ---- */
.cb-pad-compact.cb-section, .cb-pad-compact.cb-hero, .cb-pad-compact.cb-cta, .cb-pad-compact.cb-testimonial { padding-top: 2.5rem; padding-bottom: 2.5rem; }
.cb-pad-normal.cb-section,  .cb-pad-normal.cb-hero,  .cb-pad-normal.cb-cta,  .cb-pad-normal.cb-testimonial  { padding-top: 4.5rem; padding-bottom: 4.5rem; }
.cb-pad-spacious.cb-section,.cb-pad-spacious.cb-hero,.cb-pad-spacious.cb-cta,.cb-pad-spacious.cb-testimonial { padding-top: 7rem; padding-bottom: 7rem; }

/* ============================================================
   Restaurant blocks (.rx-*) — modern, field-driven sections.
   Colours/fonts inherit the site theme tokens (--slate-color-accent …),
   so the whole page recolours from Site → Appearance.
   ============================================================ */
.rx{box-sizing:border-box;--rx-accent:var(--slate-color-accent,#ff6a2b)}
.rx *,.rx *::before,.rx *::after{box-sizing:border-box}
/* Full-bleed: the host page wraps content in a narrow .cb-page (max 820px).
   Restaurant sections must span edge-to-edge. Preferred path: when the page is
   built from .rx sections, drop the column + padding so sections fill the body.
   Fallback (no :has support): break each section out to the viewport width. */
.cb-public{overflow-x:hidden}
.cb-page:has(> .rx){max-width:none;padding:0}
@supports not (selector(:has(*))){
  .rx{width:100vw;max-width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw)}
}
.rx-tone-dark{--rx-bg:#141210;--rx-text:#f6efe6;--rx-soft:#cabfb1;--rx-card:rgba(255,255,255,.05);--rx-line:rgba(255,255,255,.12)}
.rx-tone-light{--rx-bg:var(--slate-color-canvas,#fbfaf8);--rx-text:var(--slate-color-text,#241c17);--rx-soft:var(--slate-color-text-muted,#7c7268);--rx-card:var(--slate-color-surface,#fff);--rx-line:rgba(0,0,0,.09)}
.rx-tone-surface{--rx-bg:var(--slate-color-surface-sunken,#f4eee6);--rx-text:var(--slate-color-text,#241c17);--rx-soft:var(--slate-color-text-muted,#7c7268);--rx-card:var(--slate-color-surface,#fff);--rx-line:rgba(0,0,0,.08)}
.rx.rx-hero,.rx.rx-story,.rx.rx-menu,.rx.rx-gallery,.rx.rx-reviews,.rx.rx-visit{background:var(--rx-bg);color:var(--rx-text)}
/* Headings must follow the section tone, not the global dark ink rule above. */
.rx h1,.rx h2,.rx h3{color:var(--rx-text)}
.rx-hero-title em{color:var(--rx-accent)}
.rx-inner,.rx-hero-inner,.rx-story-inner{max-width:1180px;margin:0 auto;padding:clamp(64px,9vw,120px) clamp(20px,5vw,40px)}
.rx .rx-eyebrow{display:inline-flex;align-items:center;gap:.55rem;font-weight:600;font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--rx-accent)}
.rx .rx-eyebrow::before{content:"";width:24px;height:1px;background:var(--rx-accent)}
.rx .rx-h2{font-family:var(--slate-font-heading,inherit);font-weight:800;line-height:1.05;letter-spacing:-.02em;font-size:clamp(1.9rem,4vw,3rem);margin:.9rem 0 1rem}
.rx-head{max-width:640px;margin-bottom:2.6rem}
.rx-head-center{margin-left:auto;margin-right:auto;text-align:center}
.rx-head-center .rx-eyebrow{justify-content:center}
.rx-head-sub{color:var(--rx-soft);font-size:1.05rem;max-width:60ch}
.rx-head-center .rx-head-sub{margin-left:auto;margin-right:auto}
.rx-stars{color:var(--rx-accent);letter-spacing:2px}
.rx .rx-btn{display:inline-flex;align-items:center;gap:.5rem;font-weight:600;font-size:.95rem;padding:.82rem 1.5rem;border-radius:var(--slate-radius-control,100px);border:1px solid transparent;cursor:pointer;text-decoration:none;transition:transform .2s,box-shadow .2s,border-color .2s,background .2s}
.rx .rx-btn-primary{background:var(--rx-accent);color:#fff}
.rx .rx-btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 30px -10px var(--rx-accent)}
.rx .rx-btn-ghost{border-color:var(--rx-line);color:var(--rx-text)}
.rx .rx-btn-ghost:hover{border-color:var(--rx-accent);color:var(--rx-accent);transform:translateY(-2px)}
.rx-actions{display:flex;gap:.9rem;flex-wrap:wrap;margin-top:1.8rem}

/* Hero */
.rx-hero{position:relative;overflow:hidden}
.rx-hero.rx-hero-photo::before{content:"";position:absolute;inset:0;background:var(--rx-hero-img) center/cover no-repeat;opacity:.28}
.rx-hero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 85% 0%,color-mix(in srgb,var(--rx-accent) 30%,transparent),transparent 55%);pointer-events:none}
.rx-hero-inner{position:relative;z-index:1;display:grid;grid-template-columns:1.05fr .95fr;gap:3rem;align-items:center}
.rx-hero-title{font-family:var(--slate-font-heading,inherit);font-weight:800;line-height:1.03;letter-spacing:-.02em;font-size:clamp(2.6rem,6vw,4.8rem);margin:1.2rem 0 1rem}
.rx-hero-title em{font-style:normal;color:var(--rx-accent)}
.rx-hero-lead{color:var(--rx-soft);font-size:clamp(1.02rem,1.5vw,1.2rem);max-width:34ch}
.rx-trust{display:flex;align-items:center;gap:1rem;margin-top:2.2rem;flex-wrap:wrap}
.rx-trust small{color:var(--rx-soft);font-size:.85rem}
.rx-hero-card{position:relative;aspect-ratio:4/5;border-radius:calc(var(--slate-radius-md,16px) + 8px);border:1px solid var(--rx-line);overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--rx-accent) 22%,#1a130d),#100c09);box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
.rx-hero-card::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 25%,color-mix(in srgb,var(--rx-accent) 45%,transparent),transparent 60%)}
.rx-hero-badge{position:absolute;left:18px;top:18px;z-index:2;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:100px;padding:.45rem .9rem;font-size:.76rem;font-weight:600}
.rx-hero-plate{position:absolute;left:18px;right:18px;bottom:18px;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:1rem;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:1rem 1.1rem;color:#fff}
.rx-hero-plate b{font-family:var(--slate-font-heading,inherit);font-size:1.02rem;display:block}
.rx-hero-plate span{color:#d9cfc4;font-size:.82rem}
.rx-hero-price{font-family:var(--slate-font-heading,inherit);font-size:1.4rem;color:var(--rx-accent)}

/* Marquee */
.rx-marquee{overflow:hidden;border-top:1px solid var(--rx-line);border-bottom:1px solid var(--rx-line)}
.rx-mq-surface{--rx-bg:var(--slate-color-surface-sunken,#f4eee6);--rx-text:var(--slate-color-text,#241c17);--rx-line:rgba(0,0,0,.08);background:var(--rx-bg);color:var(--rx-text)}
.rx-mq-dark{--rx-bg:#141210;--rx-text:#f6efe6;--rx-line:rgba(255,255,255,.12);background:var(--rx-bg);color:var(--rx-text)}
.rx-marquee-track{display:flex;gap:3.2rem;width:max-content;padding:1rem 0;white-space:nowrap;animation:rx-scroll 28s linear infinite}
.rx-marquee-item{font-family:var(--slate-font-heading,inherit);font-size:1.05rem;display:inline-flex;align-items:center;gap:1rem;opacity:.85}
.rx-marquee-item::after{content:"●";color:var(--rx-accent);font-size:.5rem}
@keyframes rx-scroll{to{transform:translateX(-50%)}}

/* Story */
.rx-story-inner{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,5vw,4.5rem);align-items:center}
.rx-story-visual{aspect-ratio:1/1;border-radius:calc(var(--slate-radius-md,16px) + 8px);border:1px solid var(--rx-line);background-size:cover;background-position:center;position:relative;display:grid;place-items:center;overflow:hidden}
.rx-story-medallion{text-align:center;z-index:1}
.rx-story-medallion::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 50%,transparent 0 26px,color-mix(in srgb,var(--rx-accent) 16%,transparent) 26px 27px)}
.rx-stat-big{position:relative;font-family:var(--slate-font-heading,inherit);font-weight:800;font-size:clamp(3rem,8vw,5rem);line-height:1;color:var(--rx-accent)}
.rx-story-medallion small{position:relative;color:var(--rx-soft);letter-spacing:.2em;text-transform:uppercase;font-size:.76rem}
.rx-story-chip{position:absolute;left:16px;bottom:16px;background:rgba(0,0,0,.55);color:#fff;border-radius:100px;padding:.5rem 1rem;font-size:.85rem}
.rx-story-chip b{color:var(--rx-accent)}
.rx-prose{color:var(--rx-soft)}
.rx-prose br{display:block;content:"";margin-top:.6rem}
.rx-feat-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem;margin-top:2rem}
.rx-feat{padding:1.1rem;border:1px solid var(--rx-line);border-radius:14px;background:var(--rx-card)}
.rx-feat-ic{font-size:1.4rem;display:block;margin-bottom:.5rem}
.rx-feat b{font-family:var(--slate-font-heading,inherit);display:block}
.rx-feat-text{font-size:.88rem;color:var(--rx-soft)}

/* Menu */
.rx-menu-grid{display:grid;gap:1.3rem}
.rx-cols-3{grid-template-columns:repeat(3,1fr)}
.rx-cols-2{grid-template-columns:repeat(2,1fr)}
.rx-dish{border:1px solid var(--rx-line);border-radius:18px;overflow:hidden;background:var(--rx-card);transition:transform .3s,border-color .3s}
.rx-dish:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--rx-accent) 50%,var(--rx-line))}
.rx-dish-pic{aspect-ratio:16/11;position:relative;background:linear-gradient(160deg,color-mix(in srgb,var(--rx-accent) 18%,#2a1c13),#120d0a);background-size:cover;background-position:center}
.rx-dish-tag{position:absolute;top:12px;left:12px;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.18);padding:.32rem .65rem;border-radius:100px}
.rx-dish-body{padding:1.25rem}
.rx-dish-row{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.rx-dish-row h3{font-family:var(--slate-font-heading,inherit);font-size:1.2rem;margin:0}
.rx-dish-price{font-family:var(--slate-font-heading,inherit);color:var(--rx-accent);font-size:1.18rem;white-space:nowrap}
.rx-dish-body p{color:var(--rx-soft);font-size:.9rem;margin:.5rem 0 0}

/* Gallery */
/* CSS-columns masonry: flows top-to-bottom, never leaves grid holes. */
.rx-gallery-grid{columns:4 220px;column-gap:1rem}
.rx-tile{position:relative;display:block;width:100%;height:190px;margin:0 0 1rem;break-inside:avoid;-webkit-column-break-inside:avoid;border-radius:16px;border:1px solid var(--rx-line);overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--rx-accent) 16%,#241913),#0e0a08);background-size:cover;background-position:center}
.rx-tile-tall{height:300px}
.rx-tile-wide{height:150px}
.rx-tile-label{position:absolute;left:14px;bottom:12px;font-family:var(--slate-font-heading,inherit);color:#fff;font-size:.92rem;text-shadow:0 1px 6px rgba(0,0,0,.6)}

/* Reviews */
.rx-reviews-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.3rem}
.rx-review{margin:0;padding:1.7rem;border:1px solid var(--rx-line);border-radius:18px;background:var(--rx-card)}
.rx-review p{font-size:1rem;margin:1rem 0 1.3rem}
.rx-review-by{display:flex;align-items:center;gap:.8rem}
.rx-avatar{width:42px;height:42px;border-radius:50%;background:var(--rx-accent);background-size:cover;background-position:center;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--slate-font-heading,inherit);flex:none}
.rx-review-by b{font-family:var(--slate-font-heading,inherit);display:block;font-size:.95rem}
.rx-review-by small{color:var(--rx-soft);font-size:.82rem}

/* Visit */
.rx-visit-card{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(2rem,5vw,4rem);align-items:center;border:1px solid var(--rx-line);border-radius:24px;padding:clamp(1.8rem,4vw,3rem);background:var(--rx-card)}
.rx-visit-meta{margin-top:1.4rem;color:var(--rx-soft);font-size:.92rem}
.rx-hours{list-style:none;margin:0;padding:0;border-top:1px solid var(--rx-line)}
.rx-hours li{display:flex;justify-content:space-between;gap:1rem;padding:.78rem 0;border-bottom:1px solid var(--rx-line);font-size:.95rem}
.rx-hours li span{color:var(--rx-soft)}
.rx-hours li b{font-family:var(--slate-font-heading,inherit)}
.rx-hours-open b{color:var(--rx-accent)}

/* Responsive */
@media(max-width:900px){
  .rx-hero-inner,.rx-story-inner,.rx-visit-card{grid-template-columns:1fr}
  .rx-hero-card{max-width:400px;margin:0 auto;order:-1}
  .rx-cols-3,.rx-cols-2,.rx-reviews-grid{grid-template-columns:1fr 1fr}
  .rx-gallery-grid{columns:2 160px}
}
@media(max-width:560px){
  .rx-cols-3,.rx-cols-2,.rx-reviews-grid,.rx-feat-grid{grid-template-columns:1fr}
}

.cb-footer-dark .cb-footer-link:hover { color: var(--slate-color-accent); }
