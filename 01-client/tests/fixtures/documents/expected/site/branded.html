/* Content Builder — public theme. Tokens come from the inline <style> the
   Theme emits (--slate-color-accent, --slate-color-canvas, --slate-color-surface,
   --slate-color-text, etc.).
   System fonts only. */

*, *::before, *::after { box-sizing: border-box; }
.cb-public { margin: 0; line-height: 1.65; color: var(--slate-color-text, #1d2939);
             background: var(--slate-color-canvas, #fff);
             font-family: var(--slate-font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
             -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.cb-public h1, .cb-public h2, .cb-public h3 {
             font-family: var(--slate-font-heading, Georgia, serif); line-height: 1.18; color: var(--slate-color-text); }
.cb-public img { max-width: 100%; }
.cb-public a { color: var(--slate-color-accent-strong, #2563eb); }
.cb-page { max-width: 820px; margin: 0 auto; padding: 3rem 1.25rem; }

/* Block wrappers with custom styling & responsive visibility */
.cb-block-wrapper, .ve-block-style { display: block; position: relative; }
@media (min-width: 1025px)  { .ve-hide-desktop { display: none !important; } }
@media (min-width: 769px) and (max-width: 1024px) { .ve-hide-tablet { display: none !important; } }
@media (max-width: 768px)   { .ve-hide-mobile { display: none !important; } }

/* Buttons */
.cb-public .cb-btn { display: inline-block; padding: .8rem 1.7rem; border-radius: var(--slate-radius-md, 10px);
                     text-decoration: none; font-weight: 600; border: 0; cursor: pointer; transition: background .15s, transform .15s; }
.cb-public .cb-btn-primary { background: var(--slate-color-accent, #2563eb); color: var(--slate-color-on-accent, #fff); }
.cb-public .cb-btn-primary:hover { background: var(--slate-color-accent-strong, #1d4ed8); color: #fff; transform: translateY(-1px); }
.cb-public .cb-btn-outline { background: transparent; color: var(--slate-color-accent-strong); box-shadow: inset 0 0 0 1.5px var(--slate-color-accent); }
.cb-public .cb-btn-outline:hover { background: var(--slate-color-accent); color: var(--slate-color-on-accent, #fff); }

/* Shared section shell + eyebrow + divider */
.cb-section { padding: 4.5rem 1.25rem; }
.cb-section-inner { max-width: 1100px; margin: 0 auto; }
.cb-eyebrow { display: block; text-align: center; text-transform: uppercase; letter-spacing: .14em;
              font-size: .78rem; font-weight: 600; color: var(--slate-color-accent-strong); margin-bottom: .6rem; }
.cb-section-title { font-size: 2.1rem; text-align: center; margin: 0 0 .5rem; }
.cb-divider { width: 54px; height: 3px; border-radius: 3px; background: var(--slate-color-accent); margin: 0 auto 2.5rem; opacity: .8; }
.cb-section-title + .cb-divider { margin-top: 1rem; }

/* ---- Basic blocks ---- */
.cb-heading { margin: 1.4em 0 .5em; }
.cb-paragraph { margin: 0 0 1em; }
.cb-image { margin: 1.25em 0; }
.cb-image img { display: block; border-radius: var(--slate-radius-md, 8px); }
.cb-image-full img { width: 100%; height: auto; }
.cb-image-wide img { width: 100%; max-width: 900px; height: auto; }
.cb-image-normal img { max-width: 100%; height: auto; }
.cb-button { margin: 1.25em 0; }
.cb-button .btn, .cb-button .cb-btn { display: inline-block; padding: .7rem 1.4rem; border-radius: var(--slate-radius-md,8px); text-decoration: none; font-weight: 600; }
.cb-button .btn-primary { background: var(--slate-color-accent,#2563eb); color: var(--slate-color-on-accent, #fff); }
.cb-button .btn-secondary { background: var(--slate-color-surface); color: var(--slate-color-accent-strong); }
.cb-columns { display: grid; gap: 1.5rem; margin: 1.25em 0; width: 100%; }
.cb-cols-1 { grid-template-columns: 1fr; }
.cb-cols-2 { grid-template-columns: 1fr 1fr; }
.cb-cols-3 { grid-template-columns: 1fr 1fr 1fr; }
.cb-cols-4 { grid-template-columns: repeat(4, 1fr); }

/* Column ratios */
.cb-ratio-50-50 { grid-template-columns: 1fr 1fr; }
.cb-ratio-33-66 { grid-template-columns: 1fr 2fr; }
.cb-ratio-66-33 { grid-template-columns: 2fr 1fr; }
.cb-ratio-25-75 { grid-template-columns: 1fr 3fr; }
.cb-ratio-75-25 { grid-template-columns: 3fr 1fr; }
.cb-ratio-33-33-33 { grid-template-columns: 1fr 1fr 1fr; }
.cb-ratio-25-50-25 { grid-template-columns: 1fr 2fr 1fr; }
.cb-ratio-50-25-25 { grid-template-columns: 2fr 1fr 1fr; }
.cb-ratio-25-25-50 { grid-template-columns: 1fr 1fr 2fr; }
.cb-ratio-25-25-25-25 { grid-template-columns: repeat(4, 1fr); }

/* Column vertical alignment */
.cb-valign-stretch { align-items: stretch; }
.cb-valign-start { align-items: start; }
.cb-valign-center { align-items: center; }
.cb-valign-end { align-items: end; }

.cb-col { min-width: 0; display: flex; flex-direction: column; }
.cb-container { display: flex; width: 100%; margin: 1.25em 0; }

@media (max-width: 640px) {
    .cb-columns.cb-cols-stack { grid-template-columns: 1fr !important; }
    .cb-container.cb-stack-mobile { flex-direction: column !important; }
}
.cb-post-list { list-style: none; padding: 0; margin: 1.25em 0; display: flex; flex-direction: column; gap: 1rem; }
.cb-post-list-item a { font-size: 1.1rem; font-weight: 600; text-decoration: none; }
.cb-post-list-excerpt { margin: .25rem 0 0; color: var(--slate-color-text-muted); }

/* ---- Header / nav ---- */
.cb-site-header { border-bottom: 1px solid rgba(0,0,0,.06); background: var(--slate-color-canvas); }
.cb-site-header-inner { max-width: 1100px; margin: 0 auto; padding: 1.15rem 1.25rem;
                        display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.cb-brand { text-decoration: none; color: var(--slate-color-text); display: flex; flex-direction: column; line-height: 1.2; }
.cb-brand-name { font-size: 1.3rem; font-weight: 700; font-family: var(--slate-font-heading); }
.cb-brand-tagline { font-size: .8rem; color: var(--slate-color-text-muted); }
.cb-brand-logo { max-height: 44px; width: auto; display: block; }
.cb-nav { display: flex; gap: 1.6rem; flex-wrap: wrap; }
.cb-nav-link { text-decoration: none; color: var(--slate-color-text); font-weight: 500; opacity: .85; }
.cb-nav-link:hover { color: var(--slate-color-accent-strong); opacity: 1; }
.cb-header-centered .cb-site-header-inner { flex-direction: column; text-align: center; }
.cb-header-centered .cb-nav { justify-content: center; }
.cb-header-minimal .cb-brand-name { font-size: 1.05rem; }

/* ---- Footer ---- */
.cb-site-footer { border-top: 1px solid rgba(0,0,0,.06); background: var(--slate-color-surface); margin-top: 0; }
.cb-site-footer-inner { max-width: 1100px; margin: 0 auto; padding: 2.5rem 1.25rem; text-align: center; }
.cb-footer-nav { display: flex; gap: 1.4rem; justify-content: center; flex-wrap: wrap; margin-bottom: 1rem; }
.cb-footer-link { text-decoration: none; color: var(--slate-color-text); opacity: .8; }
.cb-footer-link:hover { color: var(--slate-color-accent-strong); opacity: 1; }
.cb-footer-copy { color: var(--slate-color-text-muted); font-size: .85rem; margin: 0; }
.cb-footer-minimal .cb-footer-nav { display: none; }

/* ---- Header: end group (nav + CTA button) ---- */
.cb-header-end { display: flex; align-items: center; gap: 1.6rem; flex-wrap: wrap; }
.cb-header-cta { padding: .55rem 1.2rem; font-size: .95rem; }
.cb-header-centered .cb-header-end { justify-content: center; }

/* ---- Header preset: bordered ---- */
.cb-header-bordered { border-bottom: 2px solid var(--slate-color-text); }
.cb-header-bordered .cb-site-header-inner { padding-top: 1.4rem; padding-bottom: 1.4rem; }
.cb-header-bordered .cb-nav-link { text-transform: uppercase; letter-spacing: .06em; font-size: .82rem; font-weight: 600; }

/* ---- Header preset: accent bar (filled with brand colour) ---- */
.cb-header-accent { background: var(--slate-color-accent); border-bottom: 0; }
.cb-header-accent .cb-brand-name,
.cb-header-accent .cb-brand-tagline,
.cb-header-accent .cb-nav-link { color: var(--slate-color-on-accent, #fff); }
.cb-header-accent .cb-nav-link { opacity: .9; }
.cb-header-accent .cb-nav-link:hover { opacity: 1; color: var(--slate-color-on-accent, #fff); }
.cb-header-accent .cb-header-cta { background: #fff; color: var(--slate-color-accent-strong); }
.cb-header-accent .cb-header-cta:hover { background: rgba(255,255,255,.88); }

/* ---- Footer preset: columns (brand left, links right) ---- */
.cb-footer-columns .cb-site-footer-inner { display: flex; justify-content: space-between; align-items: flex-start;
                                           gap: 2rem; text-align: left; flex-wrap: wrap; }
.cb-footer-columns .cb-footer-brandcol { display: flex; flex-direction: column; gap: .3rem; }
.cb-footer-brandname { font-family: var(--slate-font-heading); font-size: 1.2rem; font-weight: 700; color: var(--slate-color-text); }
.cb-footer-tagline { color: var(--slate-color-text-muted); font-size: .88rem; max-width: 30ch; }
.cb-footer-columns .cb-footer-linkcol { display: flex; flex-direction: column; align-items: flex-end; gap: .8rem; }
.cb-footer-columns .cb-footer-nav { margin-bottom: 0; justify-content: flex-end; }
@media (max-width: 640px) {
  .cb-footer-columns .cb-site-footer-inner { flex-direction: column; }
  .cb-footer-columns .cb-footer-linkcol { align-items: flex-start; }
  .cb-footer-columns .cb-footer-nav { justify-content: flex-start; }
}

.cb-preview-banner { background: #fef3c7; color: #92400e; padding: .5rem 1rem; text-align: center; font: 14px system-ui, sans-serif; }

/* ---- HERO: split (default) + image overlay variants ---- */
.cb-hero { padding: 4.5rem 1.25rem; background: var(--slate-color-canvas); }
.cb-hero-inner { max-width: 1100px; margin: 0 auto; }

/* Split hero: image + text side by side */
.cb-hero-split .cb-hero-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: center; }
.cb-hero-split .cb-hero-media img { width: 100%; height: 100%; max-height: 460px; object-fit: cover; border-radius: var(--slate-radius-md); display: block; }
.cb-hero-split.cb-hero-media-right .cb-hero-media { order: 2; }
.cb-hero-title { font-size: 2.8rem; letter-spacing: -.01em; margin: 0 0 .6rem; }
.cb-hero-sub { font-size: 1.15rem; color: var(--slate-color-text-muted); margin: 0 0 1.6rem; }
.cb-hero-actions { display: flex; gap: .75rem; flex-wrap: wrap; }
@media (max-width: 800px){ .cb-hero-split .cb-hero-inner { grid-template-columns: 1fr; } .cb-hero-split.cb-hero-media-right .cb-hero-media { order: 0; } .cb-hero-title { font-size: 2.1rem; } }

/* Banner hero: text over background image */
.cb-hero-banner { background-size: cover; background-position: center; color: #fff; position: relative; }
.cb-hero-banner::before { content: ""; position: absolute; inset: 0; }
.cb-hero-banner.cb-overlay-light::before  { background: rgba(0,0,0,.28); }
.cb-hero-banner.cb-overlay-medium::before { background: rgba(0,0,0,.48); }
.cb-hero-banner.cb-overlay-dark::before   { background: rgba(0,0,0,.66); }
.cb-hero-banner .cb-hero-inner { position: relative; text-align: center; max-width: 760px; }
.cb-hero-banner .cb-hero-title, .cb-hero-banner .cb-hero-sub { color: #fff; }
.cb-hero-banner .cb-hero-actions { justify-content: center; }
.cb-hero-h-short  { padding: 3rem 1.25rem; }
.cb-hero-h-tall   { padding: 8rem 1.25rem; }

/* Banner hero with NO background image: readable dark text on a soft surface,
   instead of white-on-white. */
.cb-hero-banner.cb-hero-plain { color: var(--slate-color-text); background: var(--slate-color-surface); }
.cb-hero-banner.cb-hero-plain::before { display: none; }
.cb-hero-banner.cb-hero-plain .cb-hero-title { color: var(--slate-color-text); }
.cb-hero-banner.cb-hero-plain .cb-hero-sub   { color: var(--slate-color-text-muted); }

/* ---- Section backgrounds ---- */
.cb-bg-page { background: var(--slate-color-canvas); }
.cb-bg-white { background: #fff; }
.cb-bg-tint  { background: var(--slate-color-surface); }
.cb-bg-tint2 { background: var(--slate-color-surface-sunken); }
.cb-bg-dark  { background: #0f172a; }
.cb-bg-dark .cb-section-title, .cb-bg-dark .cb-card-title { color: #f8fafc; }
.cb-bg-dark .cb-card { background: #1e293b; }
.cb-bg-dark .cb-card-text { color: #cbd5e1; }

/* ---- Grids ---- */
.cb-grid { display: grid; gap: 1.6rem; }
.cb-grid-2 { grid-template-columns: repeat(2,1fr); }
.cb-grid-3 { grid-template-columns: repeat(3,1fr); }
.cb-grid-4 { grid-template-columns: repeat(4,1fr); }
@media (max-width:820px){ .cb-grid-2,.cb-grid-3,.cb-grid-4 { grid-template-columns: 1fr; } }
@media (min-width:821px) and (max-width:1024px){ .cb-grid-4 { grid-template-columns: repeat(2,1fr); } }

/* ---- Cards (icon + image), SS2-style ---- */
.cb-card { background: var(--slate-color-surface); border-radius: var(--slate-radius-md); padding: 2rem 1.6rem;
           transition: transform .15s ease, box-shadow .15s ease; }
.cb-card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,.07); }
.cb-card-icon { display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 52px;
                border-radius: 50%; background: var(--slate-color-canvas); color: var(--slate-color-accent-strong); margin-bottom: 1.1rem; }
.cb-card-title { font-size: 1.2rem; margin: 0 0 .5rem; color: var(--slate-color-accent-strong); font-family: var(--slate-font-heading); }
.cb-card-text { color: var(--slate-color-text-muted); margin: 0 0 1rem; }
.cb-card-link { font-weight: 600; text-decoration: none; color: var(--slate-color-accent-strong); text-transform: uppercase;
                letter-spacing: .06em; font-size: .8rem; }
.cb-card-link:hover { color: var(--slate-color-accent-strong); }
.cb-icon-grid .cb-card { text-align: center; }
.cb-icon-grid .cb-card-icon { margin-left: auto; margin-right: auto; }

/* Image cards */
.cb-image-card { display: block; text-decoration: none; color: inherit; background: var(--slate-color-surface);
                 border-radius: var(--slate-radius-md); overflow: hidden; transition: transform .15s ease, box-shadow .15s ease; }
.cb-image-card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,.08); }
.cb-image-card-img { width: 100%; height: 210px; object-fit: cover; display: block; }
.cb-image-card-ph { width: 100%; height: 210px; display: flex; align-items: center; justify-content: center;
                    background: linear-gradient(135deg, var(--slate-color-surface), var(--slate-color-surface-sunken));
                    color: var(--slate-color-text-muted); opacity: .55; }
.cb-image-card-body { padding: 1.3rem 1.4rem; }
.cb-image-card-title { font-size: 1.2rem; margin: 0 0 .35rem; color: var(--slate-color-text); font-family: var(--slate-font-heading); }
.cb-image-card-text { color: var(--slate-color-text-muted); margin: 0; }

/* ---- CTA ---- */
.cb-cta { padding: 4.5rem 1.25rem; background: var(--slate-color-accent); }
.cb-cta-inner { max-width: 700px; margin: 0 auto; text-align: center; color: var(--slate-color-on-accent, #fff); }
.cb-cta-title { font-size: 2.1rem; margin: 0 0 .5rem; color: var(--slate-color-on-accent, #fff); }
.cb-cta-text { margin: 0 0 1.6rem; opacity: .92; }
.cb-cta .cb-btn-primary { background: #fff; color: var(--slate-color-accent-strong); }
.cb-cta .cb-btn-primary:hover { background: rgba(255,255,255,.9); }

/* ---- Testimonial ---- */
.cb-testimonial { padding: 4.5rem 1.25rem; background: var(--slate-color-surface-sunken); }
.cb-testimonial-inner { max-width: 760px; margin: 0 auto; text-align: center; }
.cb-testimonial-quote { font-size: 1.5rem; line-height: 1.5; font-style: italic; margin: 0 0 1.4rem; color: var(--slate-color-text);
                        font-family: var(--slate-font-heading); }
.cb-testimonial-cite { display: flex; align-items: center; justify-content: center; gap: .75rem; }
.cb-testimonial-avatar { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; }
.cb-testimonial-author { font-weight: 700; }
.cb-testimonial-role { display: block; color: var(--slate-color-text-muted); font-size: .9rem; }

/* ============================================================
   v1.5.0 — page width, type scale, button shape, section pad
   ============================================================ */

/* Global type scale (set via --slate-type-scale on :root) */
.cb-public { font-size: calc(1rem * var(--slate-type-scale, 1)); }

/* Button shape (square / rounded / pill via --slate-radius-control) */
.cb-public .cb-btn { border-radius: var(--slate-radius-control, var(--slate-radius-md, 10px)); }

/* ---- Page width presets ---- */
/* boxed: standard max-width containers (default, already set per-section).
   full:  sections span full width, inner content still constrained.
   canvas: everything edge-to-edge, no max-width — for full-bleed designs. */
.cb-w-boxed  .cb-section-inner,
.cb-w-boxed  .cb-hero-inner,
.cb-w-boxed  .cb-cta-inner,
.cb-w-boxed  .cb-testimonial-inner { /* defaults already apply */ }

.cb-w-full .cb-section-inner,
.cb-w-full .cb-hero-inner { max-width: 1320px; }

.cb-w-canvas .cb-section,
.cb-w-canvas .cb-hero,
.cb-w-canvas .cb-cta,
.cb-w-canvas .cb-testimonial { padding-left: 0; padding-right: 0; }
.cb-w-canvas .cb-section-inner,
.cb-w-canvas .cb-hero-inner,
.cb-w-canvas .cb-cta-inner,
.cb-w-canvas .cb-testimonial-inner { max-width: none; padding-left: 2rem; padding-right: 2rem; }
.cb-w-canvas .cb-hero-split .cb-hero-media img { border-radius: 0; }

/* ---- Per-section spacing ---- */
.cb-pad-compact.cb-section, .cb-pad-compact.cb-hero, .cb-pad-compact.cb-cta, .cb-pad-compact.cb-testimonial { padding-top: 2.5rem; padding-bottom: 2.5rem; }
.cb-pad-normal.cb-section,  .cb-pad-normal.cb-hero,  .cb-pad-normal.cb-cta,  .cb-pad-normal.cb-testimonial  { padding-top: 4.5rem; padding-bottom: 4.5rem; }
.cb-pad-spacious.cb-section,.cb-pad-spacious.cb-hero,.cb-pad-spacious.cb-cta,.cb-pad-spacious.cb-testimonial { padding-top: 7rem; padding-bottom: 7rem; }

/* ============================================================
   Restaurant blocks (.rx-*) — modern, field-driven sections.
   Colours/fonts inherit the site theme tokens (--slate-color-accent …),
   so the whole page recolours from Site → Appearance.
   ============================================================ */
.rx{box-sizing:border-box;--rx-accent:var(--slate-color-accent,#ff6a2b)}
.rx *,.rx *::before,.rx *::after{box-sizing:border-box}
/* Full-bleed: the host page wraps content in a narrow .cb-page (max 820px).
   Restaurant sections must span edge-to-edge. Preferred path: when the page is
   built from .rx sections, drop the column + padding so sections fill the body.
   Fallback (no :has support): break each section out to the viewport width. */
.cb-public{overflow-x:hidden}
.cb-page:has(> .rx){max-width:none;padding:0}
@supports not (selector(:has(*))){
  .rx{width:100vw;max-width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw)}
}
.rx-tone-dark{--rx-bg:#141210;--rx-text:#f6efe6;--rx-soft:#cabfb1;--rx-card:rgba(255,255,255,.05);--rx-line:rgba(255,255,255,.12)}
.rx-tone-light{--rx-bg:var(--slate-color-canvas,#fbfaf8);--rx-text:var(--slate-color-text,#241c17);--rx-soft:var(--slate-color-text-muted,#7c7268);--rx-card:var(--slate-color-surface,#fff);--rx-line:rgba(0,0,0,.09)}
.rx-tone-surface{--rx-bg:var(--slate-color-surface-sunken,#f4eee6);--rx-text:var(--slate-color-text,#241c17);--rx-soft:var(--slate-color-text-muted,#7c7268);--rx-card:var(--slate-color-surface,#fff);--rx-line:rgba(0,0,0,.08)}
.rx.rx-hero,.rx.rx-story,.rx.rx-menu,.rx.rx-gallery,.rx.rx-reviews,.rx.rx-visit{background:var(--rx-bg);color:var(--rx-text)}
/* Headings must follow the section tone, not the global dark ink rule above. */
.rx h1,.rx h2,.rx h3{color:var(--rx-text)}
.rx-hero-title em{color:var(--rx-accent)}
.rx-inner,.rx-hero-inner,.rx-story-inner{max-width:1180px;margin:0 auto;padding:clamp(64px,9vw,120px) clamp(20px,5vw,40px)}
.rx .rx-eyebrow{display:inline-flex;align-items:center;gap:.55rem;font-weight:600;font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--rx-accent)}
.rx .rx-eyebrow::before{content:"";width:24px;height:1px;background:var(--rx-accent)}
.rx .rx-h2{font-family:var(--slate-font-heading,inherit);font-weight:800;line-height:1.05;letter-spacing:-.02em;font-size:clamp(1.9rem,4vw,3rem);margin:.9rem 0 1rem}
.rx-head{max-width:640px;margin-bottom:2.6rem}
.rx-head-center{margin-left:auto;margin-right:auto;text-align:center}
.rx-head-center .rx-eyebrow{justify-content:center}
.rx-head-sub{color:var(--rx-soft);font-size:1.05rem;max-width:60ch}
.rx-head-center .rx-head-sub{margin-left:auto;margin-right:auto}
.rx-stars{color:var(--rx-accent);letter-spacing:2px}
.rx .rx-btn{display:inline-flex;align-items:center;gap:.5rem;font-weight:600;font-size:.95rem;padding:.82rem 1.5rem;border-radius:var(--slate-radius-control,100px);border:1px solid transparent;cursor:pointer;text-decoration:none;transition:transform .2s,box-shadow .2s,border-color .2s,background .2s}
.rx .rx-btn-primary{background:var(--rx-accent);color:#fff}
.rx .rx-btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 30px -10px var(--rx-accent)}
.rx .rx-btn-ghost{border-color:var(--rx-line);color:var(--rx-text)}
.rx .rx-btn-ghost:hover{border-color:var(--rx-accent);color:var(--rx-accent);transform:translateY(-2px)}
.rx-actions{display:flex;gap:.9rem;flex-wrap:wrap;margin-top:1.8rem}

/* Hero */
.rx-hero{position:relative;overflow:hidden}
.rx-hero.rx-hero-photo::before{content:"";position:absolute;inset:0;background:var(--rx-hero-img) center/cover no-repeat;opacity:.28}
.rx-hero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 85% 0%,color-mix(in srgb,var(--rx-accent) 30%,transparent),transparent 55%);pointer-events:none}
.rx-hero-inner{position:relative;z-index:1;display:grid;grid-template-columns:1.05fr .95fr;gap:3rem;align-items:center}
.rx-hero-title{font-family:var(--slate-font-heading,inherit);font-weight:800;line-height:1.03;letter-spacing:-.02em;font-size:clamp(2.6rem,6vw,4.8rem);margin:1.2rem 0 1rem}
.rx-hero-title em{font-style:normal;color:var(--rx-accent)}
.rx-hero-lead{color:var(--rx-soft);font-size:clamp(1.02rem,1.5vw,1.2rem);max-width:34ch}
.rx-trust{display:flex;align-items:center;gap:1rem;margin-top:2.2rem;flex-wrap:wrap}
.rx-trust small{color:var(--rx-soft);font-size:.85rem}
.rx-hero-card{position:relative;aspect-ratio:4/5;border-radius:calc(var(--slate-radius-md,16px) + 8px);border:1px solid var(--rx-line);overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--rx-accent) 22%,#1a130d),#100c09);box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
.rx-hero-card::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 25%,color-mix(in srgb,var(--rx-accent) 45%,transparent),transparent 60%)}
.rx-hero-badge{position:absolute;left:18px;top:18px;z-index:2;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:100px;padding:.45rem .9rem;font-size:.76rem;font-weight:600}
.rx-hero-plate{position:absolute;left:18px;right:18px;bottom:18px;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:1rem;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:1rem 1.1rem;color:#fff}
.rx-hero-plate b{font-family:var(--slate-font-heading,inherit);font-size:1.02rem;display:block}
.rx-hero-plate span{color:#d9cfc4;font-size:.82rem}
.rx-hero-price{font-family:var(--slate-font-heading,inherit);font-size:1.4rem;color:var(--rx-accent)}

/* Marquee */
.rx-marquee{overflow:hidden;border-top:1px solid var(--rx-line);border-bottom:1px solid var(--rx-line)}
.rx-mq-surface{--rx-bg:var(--slate-color-surface-sunken,#f4eee6);--rx-text:var(--slate-color-text,#241c17);--rx-line:rgba(0,0,0,.08);background:var(--rx-bg);color:var(--rx-text)}
.rx-mq-dark{--rx-bg:#141210;--rx-text:#f6efe6;--rx-line:rgba(255,255,255,.12);background:var(--rx-bg);color:var(--rx-text)}
.rx-marquee-track{display:flex;gap:3.2rem;width:max-content;padding:1rem 0;white-space:nowrap;animation:rx-scroll 28s linear infinite}
.rx-marquee-item{font-family:var(--slate-font-heading,inherit);font-size:1.05rem;display:inline-flex;align-items:center;gap:1rem;opacity:.85}
.rx-marquee-item::after{content:"●";color:var(--rx-accent);font-size:.5rem}
@keyframes rx-scroll{to{transform:translateX(-50%)}}

/* Story */
.rx-story-inner{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,5vw,4.5rem);align-items:center}
.rx-story-visual{aspect-ratio:1/1;border-radius:calc(var(--slate-radius-md,16px) + 8px);border:1px solid var(--rx-line);background-size:cover;background-position:center;position:relative;display:grid;place-items:center;overflow:hidden}
.rx-story-medallion{text-align:center;z-index:1}
.rx-story-medallion::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 50%,transparent 0 26px,color-mix(in srgb,var(--rx-accent) 16%,transparent) 26px 27px)}
.rx-stat-big{position:relative;font-family:var(--slate-font-heading,inherit);font-weight:800;font-size:clamp(3rem,8vw,5rem);line-height:1;color:var(--rx-accent)}
.rx-story-medallion small{position:relative;color:var(--rx-soft);letter-spacing:.2em;text-transform:uppercase;font-size:.76rem}
.rx-story-chip{position:absolute;left:16px;bottom:16px;background:rgba(0,0,0,.55);color:#fff;border-radius:100px;padding:.5rem 1rem;font-size:.85rem}
.rx-story-chip b{color:var(--rx-accent)}
.rx-prose{color:var(--rx-soft)}
.rx-prose br{display:block;content:"";margin-top:.6rem}
.rx-feat-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem;margin-top:2rem}
.rx-feat{padding:1.1rem;border:1px solid var(--rx-line);border-radius:14px;background:var(--rx-card)}
.rx-feat-ic{font-size:1.4rem;display:block;margin-bottom:.5rem}
.rx-feat b{font-family:var(--slate-font-heading,inherit);display:block}
.rx-feat-text{font-size:.88rem;color:var(--rx-soft)}

/* Menu */
.rx-menu-grid{display:grid;gap:1.3rem}
.rx-cols-3{grid-template-columns:repeat(3,1fr)}
.rx-cols-2{grid-template-columns:repeat(2,1fr)}
.rx-dish{border:1px solid var(--rx-line);border-radius:18px;overflow:hidden;background:var(--rx-card);transition:transform .3s,border-color .3s}
.rx-dish:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--rx-accent) 50%,var(--rx-line))}
.rx-dish-pic{aspect-ratio:16/11;position:relative;background:linear-gradient(160deg,color-mix(in srgb,var(--rx-accent) 18%,#2a1c13),#120d0a);background-size:cover;background-position:center}
.rx-dish-tag{position:absolute;top:12px;left:12px;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.18);padding:.32rem .65rem;border-radius:100px}
.rx-dish-body{padding:1.25rem}
.rx-dish-row{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.rx-dish-row h3{font-family:var(--slate-font-heading,inherit);font-size:1.2rem;margin:0}
.rx-dish-price{font-family:var(--slate-font-heading,inherit);color:var(--rx-accent);font-size:1.18rem;white-space:nowrap}
.rx-dish-body p{color:var(--rx-soft);font-size:.9rem;margin:.5rem 0 0}

/* Gallery */
/* CSS-columns masonry: flows top-to-bottom, never leaves grid holes. */
.rx-gallery-grid{columns:4 220px;column-gap:1rem}
.rx-tile{position:relative;display:block;width:100%;height:190px;margin:0 0 1rem;break-inside:avoid;-webkit-column-break-inside:avoid;border-radius:16px;border:1px solid var(--rx-line);overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--rx-accent) 16%,#241913),#0e0a08);background-size:cover;background-position:center}
.rx-tile-tall{height:300px}
.rx-tile-wide{height:150px}
.rx-tile-label{position:absolute;left:14px;bottom:12px;font-family:var(--slate-font-heading,inherit);color:#fff;font-size:.92rem;text-shadow:0 1px 6px rgba(0,0,0,.6)}

/* Reviews */
.rx-reviews-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.3rem}
.rx-review{margin:0;padding:1.7rem;border:1px solid var(--rx-line);border-radius:18px;background:var(--rx-card)}
.rx-review p{font-size:1rem;margin:1rem 0 1.3rem}
.rx-review-by{display:flex;align-items:center;gap:.8rem}
.rx-avatar{width:42px;height:42px;border-radius:50%;background:var(--rx-accent);background-size:cover;background-position:center;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--slate-font-heading,inherit);flex:none}
.rx-review-by b{font-family:var(--slate-font-heading,inherit);display:block;font-size:.95rem}
.rx-review-by small{color:var(--rx-soft);font-size:.82rem}

/* Visit */
.rx-visit-card{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(2rem,5vw,4rem);align-items:center;border:1px solid var(--rx-line);border-radius:24px;padding:clamp(1.8rem,4vw,3rem);background:var(--rx-card)}
.rx-visit-meta{margin-top:1.4rem;color:var(--rx-soft);font-size:.92rem}
.rx-hours{list-style:none;margin:0;padding:0;border-top:1px solid var(--rx-line)}
.rx-hours li{display:flex;justify-content:space-between;gap:1rem;padding:.78rem 0;border-bottom:1px solid var(--rx-line);font-size:.95rem}
.rx-hours li span{color:var(--rx-soft)}
.rx-hours li b{font-family:var(--slate-font-heading,inherit)}
.rx-hours-open b{color:var(--rx-accent)}

/* Responsive */
@media(max-width:900px){
  .rx-hero-inner,.rx-story-inner,.rx-visit-card{grid-template-columns:1fr}
  .rx-hero-card{max-width:400px;margin:0 auto;order:-1}
  .rx-cols-3,.rx-cols-2,.rx-reviews-grid{grid-template-columns:1fr 1fr}
  .rx-gallery-grid{columns:2 160px}
}
@media(max-width:560px){
  .rx-cols-3,.rx-cols-2,.rx-reviews-grid,.rx-feat-grid{grid-template-columns:1fr}
}
